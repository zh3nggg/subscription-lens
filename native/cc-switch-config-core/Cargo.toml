[package]
name = "cc-switch-config-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
base64 = "0.22"
chrono = "0.4"
dirs = "5"
log = "0.4"
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
toml_edit = "0.22"
rusqlite = { version = "0.31", features = ["bundled"] }
windows-sys = { version = "0.61", features = ["Win32_Globalization", "Win32_Storage_FileSystem"] }

[dev-dependencies]
serial_test = "3"
tempfile = "3"
