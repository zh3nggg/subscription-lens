[package]
name = "subscription-lens-router"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
# The headless core compiles the pinned CC Switch source directly while
# excluding only its desktop window shell. Proxy, provider, takeover, recovery
# and protocol conversion remain upstream CC Switch code.
cc-switch-router-core = { path = "../cc-switch-router-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util"] }
